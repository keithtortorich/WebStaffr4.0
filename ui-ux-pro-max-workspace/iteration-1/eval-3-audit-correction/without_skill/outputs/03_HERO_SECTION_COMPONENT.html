<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hero Section Component - WebStaffr Design System">
  <title>Hero Section Component - WebStaffr Design System</title>
  <style>
    /* Include the design system CSS */
    /* ============================================================================
       WebStaffr Design System v1.0
       Complete Color Palette with WCAG AA Compliance
       Generated: August 2, 2026
       ============================================================================ */

    :root {
      /* NEUTRALS - Primary palette */
      --color-bg-primary: #1A1A1A;         /* Dark background - main container */
      --color-bg-secondary: #242424;       /* Slightly lighter background */
      --color-bg-tertiary: #2E2E2E;        /* Tertiary background for contrast */

      /* TEXT COLORS */
      --color-text-primary: #CCCCCC;       /* Main body text (10.84:1 on --bg-primary) */
      --color-text-secondary: #999999;     /* Secondary/muted text (5.98:1 on --bg-primary) */
      --color-text-tertiary: #666666;      /* Very muted/hint text (3.64:1 on --bg-primary) */
      --color-text-inverse: #1A1A1A;       /* Text on light backgrounds */

      /* ACCENT COLORS - Action elements */
      --color-accent-primary: #FF6B6B;     /* Primary action (6.27:1 on --bg-primary) */
      --color-accent-dark: #E63946;        /* Darker accent (4.87:1 on --bg-primary) */
      --color-accent-light: #FF9999;       /* Lighter accent (3.89:1 on --bg-primary) */

      /* SEMANTIC COLORS */
      --color-success: #52B788;            /* Success state (5.29:1 on --bg-primary) */
      --color-success-dark: #2D6A4F;       /* Darker success */
      --color-warning: #FFB703;            /* Warning state (4.54:1 on --bg-primary) */
      --color-warning-dark: #D9A500;       /* Darker warning */
      --color-error: #D62828;              /* Error state (3.80:1 on --bg-primary) */
      --color-error-light: #FF6B6B;        /* Lighter error (same as accent) */
      --color-info: #4D96FF;               /* Info state (4.73:1 on --bg-primary) */

      /* BORDERS & DIVIDERS */
      --color-border: #3A3A3A;             /* Standard border/divider */
      --color-border-light: #2E2E2E;       /* Light border for subtle separation */
      --color-border-accent: #FF6B6B;      /* Accent border (for focus, active states) */

      /* INTERACTIVE STATES */
      --color-hover: #2E2E2E;              /* Hover background (slightly lighter) */
      --color-active: #FF6B6B;             /* Active/pressed state */
      --color-disabled: #3A3A3A;           /* Disabled element background */
      --color-disabled-text: #666666;      /* Disabled element text */
      --color-focus-ring: #FF6B6B;         /* Focus indicator outline */

      /* OVERLAYS & TRANSPARENCY */
      --color-overlay-dark: rgba(26, 26, 26, 0.95);   /* Dark overlay */
      --color-overlay-light: rgba(204, 204, 204, 0.1); /* Light overlay */
      --color-shadow-sm: rgba(0, 0, 0, 0.25);        /* Small shadow */
      --color-shadow-md: rgba(0, 0, 0, 0.35);        /* Medium shadow */

      /* TYPOGRAPHY */
      --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica',
        'Arial', sans-serif;
      --font-family-mono: 'Monaco', 'Courier New', monospace;

      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      --font-size-4xl: 2.25rem;
      --font-size-5xl: 3rem;
      --font-size-6xl: 3.75rem;

      --font-weight-light: 300;
      --font-weight-normal: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;

      --line-height-tight: 1.2;
      --line-height-normal: 1.6;
      --line-height-relaxed: 1.8;

      /* SPACING */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --space-3xl: 4rem;

      /* BORDER RADIUS */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* SHADOWS */
      --shadow-sm: 0 1px 2px var(--color-shadow-sm);
      --shadow-md: 0 4px 6px var(--color-shadow-md);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.6);
    }

    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-family-base);
      line-height: var(--line-height-normal);
    }

    /* Focus styles for accessibility */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    /* Button base styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-decoration: none;
      min-height: 44px;
      min-width: 44px;
    }

    /* Primary button */
    .btn-primary {
      background-color: var(--color-accent-primary);
      color: var(--color-text-inverse);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background-color: var(--color-accent-dark);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 1px 2px var(--color-shadow-sm);
    }

    /* Secondary button (outline) */
    .btn-secondary {
      background-color: transparent;
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
    }

    .btn-secondary:hover {
      background-color: var(--color-hover);
      border-color: var(--color-accent-primary);
      color: var(--color-accent-primary);
    }

    /* =========================================================================
       HERO SECTION COMPONENT STYLES
       ========================================================================= */

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-xl);
      background: linear-gradient(
        135deg,
        var(--color-bg-primary) 0%,
        var(--color-bg-secondary) 100%
      );
      overflow: hidden;
    }

    /* Background decoration elements */
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle,
        rgba(255, 107, 107, 0.05) 0%,
        transparent 70%
      );
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle,
        rgba(77, 150, 255, 0.05) 0%,
        transparent 70%
      );
      animation: float 25s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0);
      }
      33% {
        transform: translate(30px, -30px);
      }
      66% {
        transform: translate(-20px, 20px);
      }
    }

    /* Hero content container */
    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      text-align: center;
    }

    .hero-header {
      margin-bottom: var(--space-2xl);
    }

    .hero-subtitle {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-accent-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: var(--space-lg);
      animation: slideInDown 0.6s ease-out;
    }

    .hero-title {
      font-size: clamp(2.25rem, 8vw, 3.75rem);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      line-height: var(--line-height-tight);
      margin-bottom: var(--space-lg);
      animation: slideInUp 0.6s ease-out 0.1s both;
    }

    .hero-title strong {
      color: var(--color-accent-primary);
      position: relative;
      display: inline-block;
    }

    .hero-title strong::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--color-accent-primary);
      border-radius: 2px;
      opacity: 0.3;
    }

    .hero-description {
      font-size: var(--font-size-lg);
      color: var(--color-text-secondary);
      max-width: 600px;
      margin: 0 auto var(--space-3xl);
      line-height: var(--line-height-relaxed);
      animation: slideInUp 0.6s ease-out 0.2s both;
    }

    /* Hero CTA container */
    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-lg);
      justify-content: center;
      animation: slideInUp 0.6s ease-out 0.3s both;
    }

    .cta-primary {
      flex: 0 1 auto;
    }

    .cta-secondary {
      flex: 0 1 auto;
    }

    /* Slide in animations */
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .hero {
        min-height: auto;
        padding: var(--space-2xl) var(--space-md);
      }

      .hero-content {
        padding: var(--space-2xl) 0;
      }

      .hero-title {
        font-size: var(--font-size-3xl);
      }

      .hero-description {
        font-size: var(--font-size-base);
      }

      .hero-cta {
        flex-direction: column;
        gap: var(--space-md);
      }

      .cta-primary,
      .cta-secondary {
        width: 100%;
      }
    }

    /* Accessibility: Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Accessibility: High contrast mode support */
    @media (prefers-contrast: more) {
      .hero-title {
        text-shadow: 0 0 4px var(--color-bg-primary);
      }

      .hero-description {
        color: var(--color-text-primary);
      }
    }

    /* Utility: Accessibility skip link */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <!-- Hero Section Component -->
  <section class="hero" id="hero-section">
    <span class="sr-only">Hero Section - Welcome to WebStaffr</span>

    <!-- Hero Content -->
    <div class="hero-content">
      <!-- Subtitle -->
      <p class="hero-subtitle">Welcome to WebStaffr</p>

      <!-- Main Headline -->
      <h1 class="hero-title">
        AI-Powered <strong>Service Teams</strong> at Your Fingertips
      </h1>

      <!-- Description -->
      <p class="hero-description">
        Hire intelligent AI employees to handle customer calls, bookings, and
        lead qualification. Get your Angel widget embedded and running in hours,
        not weeks.
      </p>

      <!-- Call-to-Action Buttons -->
      <div class="hero-cta">
        <button class="btn btn-primary cta-primary">
          Get Started Free
        </button>
        <button class="btn btn-secondary cta-secondary">
          Watch Demo
        </button>
      </div>
    </div>
  </section>

  <!-- JavaScript for interactive button feedback (optional) -->
  <script>
    // Add click event listeners to buttons for interactive feedback
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', function(e) {
        console.log('Button clicked:', this.textContent);
        // Add your navigation or event logic here
      });

      // Keyboard accessibility: Space/Enter on buttons
      button.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          this.click();
        }
      });
    });

    // Accessibility: Announce to screen readers
    window.addEventListener('load', function() {
      const hero = document.querySelector('.hero');
      if (hero && window.location.hash === '') {
        hero.setAttribute('role', 'main');
        const title = hero.querySelector('h1');
        if (title) {
          // Optionally announce to screen reader
          const ariaLive = document.createElement('div');
          ariaLive.setAttribute('aria-live', 'polite');
          ariaLive.setAttribute('aria-atomic', 'true');
          ariaLive.className = 'sr-only';
          ariaLive.textContent = title.textContent;
          document.body.insertBefore(ariaLive, document.body.firstChild);
        }
      }
    });
  </script>
</body>
</html>
