[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "1.0.0"
description = "MCP server for GitHub API integration focused on WebStaffr workflow"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["github_mcp"]